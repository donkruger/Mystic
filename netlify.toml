# Netlify configuration — Mystic Manuevers marketing site
# Deploy: drag-and-drop the `site/` folder onto Netlify, or connect this
# directory as a site with the settings below.

[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
